# PDF Local - Configuración de Nginx como reverse proxy
# Instalar: sudo cp pdf-local.conf /etc/nginx/sites-available/pdf-local
# Habilitar: sudo ln -s /etc/nginx/sites-available/pdf-local /etc/nginx/sites-enabled/
# Reiniciar: sudo systemctl restart nginx

server {
    listen 80;
    server_name 192.168.0.6;

    # Tamaño máximo de archivo: 1 GB (debe coincidir con Flask)
    client_max_body_size 1024m;

    # Timeouts para archivos grandes
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para chunked transfer encoding (archivos grandes)
        proxy_request_buffering off;
    }
}
